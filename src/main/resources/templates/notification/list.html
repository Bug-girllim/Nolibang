<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  [화면] U-S15 알림함   (원본: 1_learner/U-S15.dc.html)
  [연결] NotificationController · NT-01   → return "notification/list";
  [상태] 2단계 연결 완료 (#17, 팀원 4)
  [모델] notifications(List<NotificationDTO>), tab(NotificationTab), tabs(NotificationTab[]), page·totalPages·hasPrev·hasNext, unreadCount(공통), message·errorMessage(flash)
  [동작] 다시 만든 것: 유형 탭(GET ?tab=, 폼), 모두 읽음(POST /notifications/read-all), 알림 클릭 → 읽음 + 대상 화면 이동(GET /notifications/{id}), 이전·다음 페이지 / 남긴 것: 없음
  [정리한 것] 시안의 알림 행 샘플은 th:each 한 줄로 바꿈. 이동 버튼은 알림 종류별 글자(NotificationDTO.actionLabel)
  [❓] 시각은 DB 저장값(UTC) 그대로 표시 — KST 변환 방식은 #01 확정 필요
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>알림함 · 놀이방</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@500;600;700&amp;display=swap">
  <link rel="stylesheet" th:href="@{/css/sc-base.css}">
  <link rel="stylesheet" th:href="@{/css/tw.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-theme.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-v2.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-nbell.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-side.css}">
  <link rel="stylesheet" th:href="@{/css/gnb-icons.css}">
  <link rel="stylesheet" th:href="@{/css/t-bell.css}">
</head>
<body>
<div id="dc-root"><div class="sc-host">
<div id="root"><div class="app"><header th:replace="~{common/layout :: gnb(menu='')}"></header><div class="lay"><aside aria-label="사이드 메뉴" class="side"><p class="st">마이페이지</p><nav aria-label="마이페이지 메뉴" class="side-ctx"><a class="" th:href="@{/my/works/growth}">성장 기록</a><a class="" th:href="@{/my/character}">내 캐릭터</a><a aria-current="page" class="active" th:href="@{/notifications}">알림함<span class="side-sr"> (현재 페이지)</span></a><a class="" th:href="@{/inquiries}">1:1 문의</a><a class="" th:href="@{/my/account}">계정 설정</a></nav></aside><main class="main"><div class="ph"><div><h2>알림함</h2><p>수강 확정·평가 결과·수료·댓글·문의 알림 · 안 읽음 <span class="sc-interp" th:text="${unreadCount}">2</span>개</p></div><div class="row"><form method="post" th:action="@{/notifications/read-all}" style="display: inline;"><button class="btn sm" type="submit">모두 읽음</button></form><span class="sid">U-S15</span></div></div><p class="note" th:if="${message != null}" th:text="${message}">안내</p><p class="note" th:if="${errorMessage != null}" th:text="${errorMessage}">오류 안내</p><form method="get" th:action="@{/notifications}" style="display: contents;"><div class="tabs" role="tablist"><button th:each="t : ${tabs}" th:attr="aria-selected=${t == tab}" th:classappend="${t == tab} ? 'on'" aria-selected="false" class="" name="tab" role="tab" type="submit" th:value="${t.name()}"><span class="sc-interp" th:text="${t.label}">전체</span></button></div></form><table class="t"><thead><tr><th>유형</th><th>안내 내용</th><th>날짜</th><th>상태</th><th>이동</th></tr></thead><tbody><tr th:each="n : ${notifications}" th:classappend="${!n.read} ? 'sel'" class=""><td><span class="sc-interp" th:text="${(n.read ? '' : '● ') + n.title}">● 수강 확정</span></td><td><span class="sc-interp" th:text="${n.body}">색연필화 응용 · 중급 대기 순서가 되어 수강이 자동 확정됐어요</span></td><td><span class="sc-interp" th:text="${#temporals.format(n.createdAt, 'MM.dd HH:mm')}">11.03 09:30</span></td><td><span class="chip" th:classappend="${n.read} ? 'ol' : 'dk'"><span class="sc-interp" th:text="${n.read} ? '읽음' : '안 읽음'">안 읽음</span></span></td><td><a class="btn sm" th:href="@{/notifications/{id}(id=${n.id})}"><span class="sc-interp" th:text="${n.actionLabel}">확정 내용 보기</span></a></td></tr><tr th:if="${#lists.isEmpty(notifications)}"><td colspan="5">알림이 없어요.</td></tr></tbody></table><div class="row" th:if="${totalPages > 1}"><a class="btn sm" th:if="${hasPrev}" th:href="@{/notifications(tab=${tab.name()},page=${page - 1})}">이전</a><span class="mu" th:text="${(page + 1) + ' / ' + totalPages}">1 / 2</span><a class="btn sm" th:if="${hasNext}" th:href="@{/notifications(tab=${tab.name()},page=${page + 1})}">다음</a></div><div class="note">※ 모든 알림은 사이트 알림으로만 보내요(이메일 알림 없음). 대기 순서가 되면 수락 없이 바로 수강이 확정돼요. 알림을 누르면 읽음으로 바뀌고 대상 화면으로 이동합니다.</div></main></div><div th:replace="~{common/layout :: footer}"></div></div></div>
</div></div>
</body>
</html>
