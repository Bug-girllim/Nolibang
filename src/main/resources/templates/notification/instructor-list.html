<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  [화면] T-S09 강사 알림함   (원본: 2_teacher/T-S09.dc.html)
  [연결] NotificationController · NT-01 (학습자 알림함과 같은 URL /notifications — 강사 역할이면 이 화면)   → return "notification/instructor-list";
  [상태] 2단계 연결 완료 (#17, 팀원 4)
  [모델] notifications(List<NotificationDTO>), tab(NotificationTab), tabs(NotificationTab[]), page·totalPages·hasPrev·hasNext, unreadCount(공통), message·errorMessage(flash)
  [동작] 다시 만든 것: 유형 탭(GET ?tab=, 폼), 모두 읽음(POST), 알림 클릭 → 읽음 + 대상 화면 이동, 이전·다음 페이지 / 남긴 것: 없음
  [정리한 것] 피드백 마감 임박 알림 행·안내 문구 제거(11-06 팀 결정: 마감 임박은 평가 목록 경고로만 표시), "콘텐츠 검수 · 담당 취미 보기"(T-S08, 만들지 않는 화면) 샘플 제거
  [❓] 시각은 DB 저장값(UTC) 그대로 표시 — KST 변환 방식은 #01 확정 필요
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>강사 알림함 · 놀이방</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@500;600;700&amp;display=swap">
  <link rel="stylesheet" th:href="@{/css/sc-base.css}">
  <link rel="stylesheet" th:href="@{/css/tw.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-theme.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-v2.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-nbell.css}">
  <link rel="stylesheet" th:href="@{/css/gnb-icons.css}">
  <link rel="stylesheet" th:href="@{/css/t-bell.css}">
</head>
<body>
<div id="dc-root"><div class="sc-host">
<div id="root"><div class="app"><header th:replace="~{common/layout :: gnb(menu='lms')}"></header><div class="lay"><aside th:replace="~{common/layout :: teacherSide(active='T-S09')}"></aside><main class="main"><div class="ph"><div><h2>강사 알림함</h2><p>문의·댓글·과제 제출·운영 안내 · 안 읽음 <span class="sc-interp" th:text="${unreadCount}">3</span>개</p></div><div class="row"><form method="post" th:action="@{/notifications/read-all}" style="display: inline;"><button class="btn sm" type="submit">모두 읽음</button></form><span class="sid">T-S09</span></div></div><p class="note" th:if="${message != null}" th:text="${message}">안내</p><p class="note" th:if="${errorMessage != null}" th:text="${errorMessage}">오류 안내</p><form method="get" th:action="@{/notifications}" style="display: contents;"><div class="tabs" role="tablist"><button th:each="t : ${tabs}" th:attr="aria-selected=${t == tab}" th:classappend="${t == tab} ? 'on'" aria-selected="false" class="" name="tab" role="tab" type="submit" th:value="${t.name()}"><span class="sc-interp" th:text="${t.label}">전체</span></button></div></form><table class="t"><thead><tr><th>유형</th><th>안내 내용</th><th>날짜</th><th>상태</th><th>이동</th></tr></thead><tbody><tr th:each="n : ${notifications}" th:classappend="${!n.read} ? 'sel'" class=""><td><span class="sc-interp" th:text="${(n.read ? '' : '● ') + n.title}">● 새 문의</span></td><td><span class="sc-interp" th:text="${n.body}">색연필화 기초 수강생 문의가 새로 들어왔어요. 답변을 기다리고 있어요.</span></td><td><span class="sc-interp" th:text="${#temporals.format(n.createdAt, 'MM.dd HH:mm')}">11.04 10:20</span></td><td><span class="chip" th:classappend="${n.read} ? 'ol' : 'dk'"><span class="sc-interp" th:text="${n.read} ? '읽음' : '안 읽음'">안 읽음</span></span></td><td><a class="btn sm" th:href="@{/notifications/{id}(id=${n.id})}"><span class="sc-interp" th:text="${n.actionLabel}">답변하기</span></a></td></tr><tr th:if="${#lists.isEmpty(notifications)}"><td colspan="5">알림이 없어요.</td></tr></tbody></table><div class="row" th:if="${totalPages > 1}"><a class="btn sm" th:if="${hasPrev}" th:href="@{/notifications(tab=${tab.name()},page=${page - 1})}">이전</a><span class="mu" th:text="${(page + 1) + ' / ' + totalPages}">1 / 2</span><a class="btn sm" th:if="${hasNext}" th:href="@{/notifications(tab=${tab.name()},page=${page + 1})}">다음</a></div><div class="note">※ 알림을 누르면 읽음으로 바뀌고 해당 화면으로 이동합니다. 피드백 마감이 가까운 과제는 평가 목록 화면에 경고로 표시돼요.</div></main></div><div th:replace="~{common/layout :: footer}"></div></div></div>
</div></div>
</body>
</html>
