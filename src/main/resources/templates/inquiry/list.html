<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  [화면] U-S18 1:1 문의   (원본: 1_learner/U-S18.dc.html)
  [연결] InquiryController · IQ-01·IQ-03   → return "inquiry/list";  (IQ-03 스레드 보기도 이 템플릿 — 시안이 목록과 스레드를 한 화면에 보여 줌)
  [상태] 2단계 연결 완료 (#21, 팀원 4)
  [모델] threads(List<InquiryDTO>: 문의 가능한 수강·지난 스레드), thread(InquiryDTO: 선택한 항목, 없으면 null), messages(List<InquiryMessageDTO>), maxContentLength, message·errorMessage(flash)
  [동작] 다시 만든 것: 목록 항목 선택(링크), 새 문의(POST /inquiries: enrollmentId·title·content), 답장(POST /inquiries/{id}/messages: content), 보내기 / 남긴 것: 없음
  [정리한 것] "글자 수 기준 [미정]" 문구는 임시 상한(maxContentLength) 안내로 바꿈. 새 스레드일 때만 제목 입력칸(title) 추가 — DB inquiry_threads.title 필수
  [❓] 글자 수 상한 2000자는 임시값(#01 확정 필요). 시각은 DB 저장값(UTC) 그대로 표시
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>1:1 문의 · 놀이방</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@500;600;700&amp;display=swap">
  <link rel="stylesheet" th:href="@{/css/sc-base.css}">
  <link rel="stylesheet" th:href="@{/css/tw.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-theme.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-v2.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-nbell.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-side.css}">
  <link rel="stylesheet" th:href="@{/css/gnb-icons.css}">
  <link rel="stylesheet" th:href="@{/css/t-bell.css}">
</head>
<body>
<div id="dc-root"><div class="sc-host">
<div id="root"><div class="app"><header th:replace="~{common/layout :: gnb(menu='')}"></header><div class="lay"><aside aria-label="사이드 메뉴" class="side"><p class="st">마이페이지</p><nav aria-label="마이페이지 메뉴" class="side-ctx"><a class="" th:href="@{/my/works/growth}">성장 기록</a><a class="" th:href="@{/my/character}">내 캐릭터</a><a class="" th:href="@{/notifications}">알림함</a><a aria-current="page" class="active" th:href="@{/inquiries}">1:1 문의<span class="side-sr"> (현재 페이지)</span></a><a class="" th:href="@{/my/account}">계정 설정</a></nav></aside><main class="main"><div class="ph"><div><h2>1:1 문의</h2><p>담당 강사 문의 스레드</p></div><div class="row"><span class="sid">U-S18</span></div></div><p class="note" th:if="${message != null}" th:text="${message}">안내</p><p class="note" th:if="${errorMessage != null}" th:text="${errorMessage}">오류 안내</p><div class="sp2"><div class="box"><p class="h3">나의 문의 목록</p><p class="mu">강의별 담당 강사 스레드</p><a aria-current="false" class="box click" style="text-align: left; display: block; text-decoration: none; color: inherit;" th:each="t : ${threads}" th:classappend="${thread != null and t.enrollmentId == thread.enrollmentId} ? 'k'" th:attr="aria-current=${thread != null and t.enrollmentId == thread.enrollmentId}" th:href="${t.hasThread} ? @{/inquiries/{id}(id=${t.threadId})} : @{/inquiries(enrollmentId=${t.enrollmentId})}"><p class="h4"><span class="sc-interp" th:text="${t.courseTitle + ' · ' + t.levelLabel}">색연필화 기초 · 입문</span></p><span class="chip" th:classappend="${!t.answered} ? 'ol'"><span class="sc-interp" th:text="${t.stateLabel}">답변 완료</span></span></a><p class="mu" th:if="${#lists.isEmpty(threads)}">문의할 수 있는 강의가 없어요. 수강 중이거나 수료한 강의에서 문의할 수 있어요.</p></div><div class="box" th:if="${thread != null}"><p class="h3"><span class="sc-interp" th:text="${thread.courseTitle + ' · ' + thread.levelLabel}">색연필화 기초 · 입문</span> 문의</p><p class="mu"><span class="sc-interp" th:text="${(thread.sectionName != null ? thread.sectionName + ' · ' : '') + (thread.vacant ? '담당 전문 강사 없음(담당 공백)' : '담당 전문 강사 ' + thread.instructorName)}">A분반 · 담당 전문 강사 강사 A</span></p><div class="bubble" th:each="m : ${messages}" th:classappend="${m.mine} ? 'me'"><p class="h4"><span class="sc-interp" th:text="${m.authorLabel}">나</span> · <span class="sc-interp" th:text="${#temporals.format(m.createdAt, 'MM.dd HH:mm')}">10.28 14:00</span></p><p><span class="sc-interp" th:text="${m.body}">2차시의 명암 표현이 어렵습니다.</span></p></div><p class="mu" th:if="${thread.hasThread and #lists.isEmpty(messages)}">아직 메시지가 없어요.</p><form method="post" th:if="${thread.canWrite}" th:action="${thread.hasThread} ? @{/inquiries/{id}/messages(id=${thread.threadId})} : @{/inquiries}"><input name="enrollmentId" th:if="${!thread.hasThread}" th:value="${thread.enrollmentId}" type="hidden"/><label class="lb" for="t" th:if="${!thread.hasThread}">문의 제목</label><input id="t" maxlength="200" name="title" placeholder="비워 두면 내용 앞부분으로 만들어져요" style="width: 100%; box-sizing: border-box; padding: 8px 10px;" th:if="${!thread.hasThread}" type="text"/><label class="lb" for="q">새 문의 / 답장</label><textarea class="" id="q" name="content" placeholder="문의 내용을 입력하세요" required="required" th:maxlength="${maxContentLength}" style="width: 100%; box-sizing: border-box; min-height: 80px; padding: 8px 10px;"></textarea><div class="rowb"><span class="mu">최대 <span class="sc-interp" th:text="${maxContentLength}">2000</span>자</span><button class="btn dk" type="submit"><span class="sc-interp">보내기</span></button></div></form><div class="note" th:unless="${thread.canWrite}" th:text="${thread.vacant} ? '담당 강사가 정해지지 않아 지금은 문의를 작성할 수 없어요. 담당 강사가 정해지면 같은 스레드에서 이어 쓸 수 있어요.' : '수강이 끝난 강의라 새 메시지를 쓸 수 없어요.'">담당 공백 안내</div></div></div></main></div><div th:replace="~{common/layout :: footer}"></div></div></div>
</div></div>
</body>
</html>
