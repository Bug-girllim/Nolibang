  [화면] C-01 메인 홈   (원본: 0_common/Main.dc.html)
  [연결] MainController · CM-01   → return "main/home";
  [상태] 1단계 자동 변환본 — 디자인만 옮김. 글자·숫자·목록은 시안 샘플 값이며 담당 이슈에서 th:text·th:each 등으로 바인딩한다.
         링크의 id 값(예: /courses/2)은 시드 데이터 기준 예시값이다.
  [머리글 알림] 학습자·강사 로그인 시 알림 벨(.nb — atelier-nb-home.css) + 최근 알림 미리보기. 값은 HeaderNotificationInterceptor 의
         unreadCount·headerNotifications(다른 화면 공통 머리글 common/layout gnb 와 같은 값). 로그인 직후 도착하는 화면이라 숫자를 바로 보여 준다.
  [시안에서 동작하던 요소] 변환 후 동작하지 않음 → 필요한 것만 서버 요청(form·redirect) 또는 짧은 JS로 다시 구현
    - a [onClick] "취미 탐색하기 →"
    - div [onKeyDown,onPointerDown,onPointerMove,onPointerUp,onPointerCancel] "미술·드로잉 요리·베이킹"
    - a [onClick] "미술·드로잉"
    - a [onClick] "요리·베이킹"
    - button [onClick] "학습자"
    - button [onClick] "강사"
    - button [onClick] "관리자"
-->
