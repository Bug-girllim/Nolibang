<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  [화면] U-S03 수준별 강의 목록   (원본: 1_learner/U-S03.dc.html)
  [연결] CourseController · CO-01   → return "course/list";
  [상태] 2단계 연결 완료 (#08, 팀원 2)
  [모델] hobby(HobbyDTO), courses(List<CourseDTO>: 정원 seats·내 신청 상태 enrollStatus 포함), selectedLevel(CourseLevel 또는 null=전체), levels(CourseLevel[]),
         menuCategories(세부 취미 선택·사이드 메뉴), sideActive·sideCategoryId·sideHobbyId
  [동작] 다시 만든 것: 수준 탭(GET ?level=), 세부 취미 선택(GET ?hobbyId=), 신청 가능 상태의 [수강 신청] → POST /enrollments(#09에서 연결)
         남긴 것(이번 범위 밖): [이어서 학습] — 수강 id(enrollmentId)가 필요해 #09·#12에서 연결
  [정리] 시안에 없던 "전체" 탭을 추가했다(API CO-01: level이 없으면 전체). 시안의 "총 정원 N명"은 신청 가능한 분반 합계이며 남은 자리를 함께 보여 준다.
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>수준별 강의 목록 · 놀이방</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@500;600;700&amp;display=swap">
  <link rel="stylesheet" th:href="@{/css/sc-base.css}">
  <link rel="stylesheet" th:href="@{/css/tw.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-theme.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-v2.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-nbell.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-side.css}">
  <link rel="stylesheet" th:href="@{/css/gnb-icons.css}">
  <link rel="stylesheet" th:href="@{/css/t-bell.css}">
  <link rel="stylesheet" th:href="@{/css/side-fly.css}">
  <link rel="stylesheet" th:href="@{/css/course-image.css}">
</head>
<body>
<div id="dc-root"><div class="sc-host">
<div id="root"><div class="app"><header th:replace="~{common/layout :: gnb(menu='hobby')}"></header><div class="lay"><aside th:replace="~{hobby/side :: explore(active=${sideActive}, categoryId=${sideCategoryId}, hobbyId=${sideHobbyId})}"></aside><main class="main"><div class="ph"><div><h2>수준별 강의 목록</h2><p>강의 상태·정원·대기 확인</p></div><div class="row"><span class="sid">U-S03</span></div></div><form class="tabs" role="tablist" method="get" th:action="@{/courses}"><input type="hidden" name="hobbyId" th:value="${hobby.id}"/><button type="submit" role="tab" th:class="${selectedLevel == null} ? 'on' : ''" th:attr="aria-selected=${selectedLevel == null}">전체</button><button type="submit" role="tab" name="level" th:each="lv : ${levels}" th:value="${lv}" th:class="${lv == selectedLevel} ? 'on' : ''" th:attr="aria-selected=${lv == selectedLevel}" th:text="${lv.label}">입문</button></form><form class="field" method="get" th:action="@{/courses}"><label class="lb" for="u3-h">세부 취미</label><select id="u3-h" name="hobbyId" style="width: 240px;" onchange="this.form.submit()"><th:block th:each="category : ${menuCategories}"><option th:each="item : ${category.hobbies}" th:value="${item.id}" th:text="${item.name}" th:selected="${item.id == hobby.id}">색연필화</option></th:block></select></form><p class="h3"><span class="sc-interp" th:text="${hobby.name}">색연필화</span> · <span class="sc-interp" th:text="${selectedLevel != null} ? ${selectedLevel.label} : '전체 수준'">입문</span> 강의</p><div class="box k lv-card" th:each="course : ${courses}"><div class="hb-pic lv-pic" th:classappend="${course.picClass}" role="img" th:attr="aria-label=|${course.title} 대표 이미지|"></div><div class="col" style="flex: 1 1 0%; gap: 6px;"><div class="rowb"><p class="h3"><span class="sc-interp" th:text="${course.title}">색연필화 기초</span></p><span class="chip" th:classappend="${hobby.operating} ? 'run'" th:text="${hobby.stateLabel}">운영 중</span></div><p class="mu">필수 3차시 · 수강 확정 후 30일 · 분반·담당 강사는 자동 배정</p><div class="row"><span class="chip" th:classappend="${course.enrollStatus.state == 'LEARNING' or course.enrollStatus.state == 'COMPLETED'} ? 'dk'">내 상태: <span class="sc-interp" th:text="${course.enrollStatus.label}">신청 가능</span></span><span class="chip">총 정원 <span class="sc-interp" th:text="${course.seats.totalCapacity}">20</span>명</span><span class="chip">남은 자리 <span class="sc-interp" th:text="${course.seats.remainingSeats}">0</span>석</span><span class="chip">대기 <span class="sc-interp" th:text="${course.seats.waitingCount}">0</span>명</span></div></div><div class="col" style="justify-content: center; min-width: 150px;"><a class="btn" th:href="@{/courses/{id}(id=${course.id})}">강의 상세</a><form method="post" th:action="@{/enrollments}" style="margin: 0px;" th:if="${course.enrollStatus.applyOpen}"><input type="hidden" name="courseId" th:value="${course.id}"/><button class="btn pri" type="submit" th:text="${course.enrollStatus.state == 'CAN_WAIT'} ? '대기 신청' : '수강 신청'">수강 신청</button></form><a class="btn pri" th:if="${course.enrollStatus.state == 'LOGIN_REQUIRED'}" th:href="@{/auth/login}">로그인 후 신청</a></div></div><p class="box dash" role="status" th:if="${#lists.isEmpty(courses)}">조건에 맞는 강의가 없어요.</p><div class="note">※ 수료·취소·만료한 강의는 다시 신청할 수 없어요(D-55). 다른 수준 강의는 바로 신청할 수 있습니다. 비공개 강의는 목록에 노출하지 않습니다.</div></main></div><div th:replace="~{common/layout :: footer}"></div></div></div>
</div></div>
</body>
</html>
