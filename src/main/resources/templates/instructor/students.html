<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  [화면] T-S02 담당 학습자 관리   (원본: 2_teacher/T-S02.dc.html)
  [연결] InstructorStudentController · IN-02   → return "instructor/students";
  [상태] 2단계 연결 완료 (#07, 팀원 1)
  [모델] students(List<StudentProgressDTO>), sections(List<SectionSummaryDTO>), statuses(StudentStatus[]), sectionId·name·status(입력값 유지)
  [동작] 다시 만든 것: 분반·이름·상태 필터(GET ?sectionId=&name=&status=) / 남긴 것: 없음 (평가 상세 "보기"는 #14 화면으로 이동, 제출 전이면 숨김)
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>담당 학습자 관리 · 놀이방</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@500;600;700&amp;display=swap">
  <link rel="stylesheet" th:href="@{/css/sc-base.css}">
  <link rel="stylesheet" th:href="@{/css/tw.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-theme.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-v2.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-nbell.css}">
  <link rel="stylesheet" th:href="@{/css/gnb-icons.css}">
  <link rel="stylesheet" th:href="@{/css/t-bell.css}">
</head>
<body>
<div id="dc-root"><div class="sc-host">
<div id="root"><div class="app"><header th:replace="~{common/layout :: gnb(menu='lms')}"></header><div class="lay"><aside th:replace="~{common/layout :: teacherSide(active='T-S02')}"></aside><main class="main"><div class="ph"><div><h2>담당 학습자 관리</h2><p>수강생 진도·과제 현황</p></div><div class="row"><span class="sid">T-S02</span></div></div><form method="get" th:action="@{/instructor/students}"><div class="row" style="align-items: flex-end;"><div class="field"><label class="lb">현재 담당 분반</label><select name="sectionId" onchange="this.form.submit()"><option value="">전체 담당 분반</option><option th:each="sec : ${sections}" th:value="${sec.sectionId}" th:selected="${sec.sectionId == sectionId}" th:text="${sec.courseTitle + ' · ' + sec.levelLabel + ' · ' + sec.sectionName}">색연필화 기초 · 입문 · A분반</option></select></div><div class="field"><label class="lb">학습자 검색</label><input name="name" placeholder="이름" th:value="${name}"/></div><div class="field"><label class="lb">상태</label><select name="status" onchange="this.form.submit()"><option value="">전체</option><option th:each="st : ${statuses}" th:value="${st.name()}" th:selected="${st == status}" th:text="${st.label}">학습 중</option></select></div></div></form><p class="h3">수강생별 학습 현황</p><table class="t"><thead><tr><th>이름(실명)</th><th>강의·분반</th><th>수강 기간</th><th>남은 기간</th><th>차시 진행</th><th>최종 과제</th><th>평가 현황</th><th>상세</th></tr></thead><tbody><tr class="clk" th:each="s : ${students}"><td><span class="sc-interp" th:text="${s.realName}">김학습</span></td><td><span class="sc-interp" th:text="${s.courseTitle + ' · ' + s.sectionName}">색연필화 기초 · A분반</span></td><td><span class="sc-interp" th:text="${#temporals.format(s.confirmedAt, 'MM.dd') + '~' + #temporals.format(s.expiresAt, 'MM.dd')}">10.15~11.14</span></td><td><span class="sc-interp" th:text="${s.remainingText}">12일 0시간</span></td><td><span class="sc-interp" th:text="${s.completedLessons + ' / ' + s.totalLessons}">2 / 3</span></td><td><span class="sc-interp" th:text="${s.submitted ? '제출' : '미제출'}">미제출</span></td><td><span class="sc-interp" th:text="${s.status.label + (s.reviewDueAt != null ? ' · 마감 ' + #temporals.format(s.reviewDueAt, 'MM.dd HH:mm') : '')}">학습 중</span></td><td><a class="btn sm" th:if="${s.latestReviewId != null}" th:href="@{/instructor/reviews/{id}(id=${s.latestReviewId})}">보기</a></td></tr><tr th:if="${#lists.isEmpty(students)}"><td class="mu" colspan="8">조건에 맞는 학습자가 없습니다.</td></tr></tbody></table><p class="mu">표시 <span class="sc-interp" th:text="${#lists.size(students)}">9</span>명 · 담당하지 않는 분반 학습자는 조회할 수 없어요.</p></main></div><div th:replace="~{common/layout :: footer}"></div></div></div>
</div></div>
</body>
</html>
