<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  [화면] T-S06 문의·공개 댓글   (원본: 2_teacher/T-S06.dc.html)
  [연결] InstructorInquiryController · II-01·II-02   → return "instructor/inquiries";  (II-02 스레드 보기도 이 템플릿 — 시안이 목록과 스레드를 한 화면에 보여 줌)
  [상태] 2단계 연결 완료 (#21, 팀원 4)
  [모델] threads(List<InquiryDTO>: 현재 담당 분반 학습자의 스레드), thread(선택한 스레드, 없으면 null), messages(List<InquiryMessageDTO>), waitingCount, unansweredOnly, maxContentLength, message·errorMessage(flash)
  [동작] 다시 만든 것: 스레드 선택(링크), 답변 대기만 보기(?answered=false), 답변 등록(POST /instructor/inquiries/{id}/answer: content), "공개 작품 댓글" 탭은 #18 게시판(/works)으로 이동 / 남긴 것: 없음
  [정리한 것] 분반 이름(A분반)은 이 화면 모델에 없어 뺌. 학습자 실명은 담당 강사에게만 표시(NFR-04)
  [❓] 글자 수 상한 2000자는 임시값(#01 확정 필요). 시각은 DB 저장값(UTC) 그대로 표시
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>문의·공개 댓글 · 놀이방</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@500;600;700&amp;display=swap">
  <link rel="stylesheet" th:href="@{/css/sc-base.css}">
  <link rel="stylesheet" th:href="@{/css/tw.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-theme.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-v2.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-nbell.css}">
  <link rel="stylesheet" th:href="@{/css/gnb-icons.css}">
  <link rel="stylesheet" th:href="@{/css/t-bell.css}">
</head>
<body>
<div id="dc-root"><div class="sc-host">
<div id="root"><div class="app"><header th:replace="~{common/layout :: gnb(menu='lms')}"></header><div class="lay"><aside th:replace="~{common/layout :: teacherSide(active='T-S06')}"></aside><main class="main"><div class="ph"><div><h2>강사 문의·공개 댓글</h2><p>학습자가 보낸 문의에 답변만 합니다 · 강사의 일방 메시지·알림 발송 기능 없음</p></div><div class="row"><span class="sid">T-S06</span></div></div><p class="note" th:if="${message != null}" th:text="${message}">안내</p><p class="note" th:if="${errorMessage != null}" th:text="${errorMessage}">오류 안내</p><form method="get" th:action="@{/works}" style="display: contents;"><div class="tabs" role="tablist"><button aria-selected="true" class="on" role="tab" type="button">1:1 문의 (답변 대기 <span class="sc-interp" th:text="${waitingCount}">1</span>)</button><button aria-selected="false" class="" role="tab" type="submit">공개 작품 댓글</button></div></form><div class="sp2"><div class="box"><p class="h3">담당 학습자 문의</p><p class="mu">현재 담당 분반 학습자의 스레드만 · <a class="lk" th:if="${!unansweredOnly}" th:href="@{/instructor/inquiries(answered=false)}">답변 대기만 보기</a><a class="lk" th:if="${unansweredOnly}" th:href="@{/instructor/inquiries}">전체 보기</a></p><a aria-current="false" class="box click" style="text-align: left; display: block; text-decoration: none; color: inherit;" th:each="t : ${threads}" th:classappend="${thread != null and t.threadId == thread.threadId} ? 'k'" th:attr="aria-current=${thread != null and t.threadId == thread.threadId}" th:href="${unansweredOnly} ? @{/instructor/inquiries/{id}(id=${t.threadId},answered=false)} : @{/instructor/inquiries/{id}(id=${t.threadId})}"><div class="rowb"><p class="h4"><span class="sc-interp" th:text="${t.courseTitle + ' / ' + t.learnerName}">색연필화 기초 / 김학습</span></p><span class="chip" th:classappend="${!t.answered} ? 'ol'"><span class="sc-interp" th:text="${t.stateLabel}">답변 완료</span></span></div></a><p class="mu" th:if="${#lists.isEmpty(threads)}">담당 학습자의 문의가 없어요.</p></div><div class="box" th:if="${thread != null}"><p class="h3">문의 답변 — <span class="sc-interp" th:text="${thread.courseTitle + ' / ' + thread.learnerName}">색연필화 기초 / 김학습</span></p><p class="mu"><span class="sc-interp" th:text="${thread.courseTitle + ' · ' + thread.levelLabel}">색연필화 기초 · 입문</span> · <a class="lk" th:href="@{/instructor/students}">학습자 상세</a></p><div class="bubble" th:each="m : ${messages}" th:classappend="${m.mine} ? 'me'"><p class="h4"><span class="sc-interp" th:text="${m.authorLabel}">수강생</span> · <span class="sc-interp" th:text="${#temporals.format(m.createdAt, 'MM.dd HH:mm')}">10.28 14:00</span></p><p><span class="sc-interp" th:text="${m.body}">2차시의 명암 표현이 어렵습니다.</span></p></div><form method="post" th:action="@{/instructor/inquiries/{id}/answer(id=${thread.threadId})}"><label class="lb" for="ans">답변 입력</label><textarea class="" id="ans" name="content" placeholder="답변 내용을 입력하세요" required="required" th:maxlength="${maxContentLength}" style="width: 100%; box-sizing: border-box; min-height: 80px; padding: 8px 10px;"></textarea><div class="rowb"><span class="mu">최대 <span class="sc-interp" th:text="${maxContentLength}">2000</span>자</span><button class="btn dk" type="submit"><span class="sc-interp">답변 등록</span></button></div></form><div class="note">※ 강사가 먼저 일반 메시지나 전체 공지를 전송하는 기능은 없습니다.</div></div></main></div><div th:replace="~{common/layout :: footer}"></div></div></div>
</div></div>
</body>
</html>
