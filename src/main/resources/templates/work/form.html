<div id="root"><div class="app"><header th:replace="~{common/layout :: gnb(menu='')}"></header><div class="lay"><aside aria-label="사이드 메뉴" class="side"><p class="st">마이페이지</p><nav aria-label="마이페이지 메뉴" class="side-ctx"><a class="" th:href="@{/my/learning}">나의 학습</a><a aria-current="true" class="active" th:href="@{/my/works/growth}">성장 기록<span class="side-sr"> (현재 위치)</span></a><a class="" th:href="@{/notifications}">알림함</a><a class="" th:href="@{/inquiries}">1:1 문의</a><a class="" th:href="@{/my/account}">계정 설정</a></nav></aside><main class="main"><div class="ph"><div><h2><span class="sc-interp">일반 작품 등록</span></h2><p>사진·취미·회고·공개 설정</p></div><div class="row"><span class="sid">U-S11</span></div></div><div class="sp"><div class="box"><div class="rowb"><p class="h3"><span class="sc-interp">일반 작품 작성</span></p></div><p class="mu">최종 수료용 과제와 구분되는 개인 작품 게시물 · 수료와 무관</p><div class="g2"><div class="field"><label class="lb" for="w-t">작품 제목 *</label><input aria-invalid="false" class="" id="w-t" placeholder="직접 입력" value=""/><p class="mu" style="margin: 4px 0px 0px;"><span class="sc-interp">0</span>자</p></div><div class="field"><label class="lb" for="w-h">취미 선택 *</label><select class="" id="w-h"><option value="">선택</option><option value="색연필화">색연필화</option><option value="디지털 드로잉">디지털 드로잉</option><option value="디저트 만들기">디저트 만들기</option></select><p class="mu">운영 중 취미만 선택 가능</p></div></div><div class="field"><label class="lb" for="w-l">수준 태그</label><select id="w-l"><option value="입문"><span class="sc-interp">입문</span></option></select><p class="mu">보유한 배지 수준 이하만 선택 (기본 입문)</p></div><div><span class="lb">사진 * (1~5장 · JPG/PNG/WebP · 장당 50MB)</span><div class="g5"><label class="img" style="height: 84px; cursor: pointer;"><span style="position: relative; background: rgb(247, 247, 247); padding: 0px 4px;">+ 이미지 추가</span><input accept="image/jpeg,image/png,image/webp" aria-label="작품 사진 선택" hidden="" multiple="" type="file"/></label></div></div><div class="field"><label class="lb" for="w-d"
