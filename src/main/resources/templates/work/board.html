<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  [화면] U-S09 작품 게시판   (원본: 1_learner/U-S09.dc.html)
  [연결] WorkBoardController · WB-01   → return "work/board";
  [상태] 2단계 연결 완료 (#18, 팀원 4)
  [모델] works(WorkPageDTO: items=WorkDTO 카드, totalCount, page, hasNext), cond(WorkSearchDTO), hobbies(HobbyDTO 목록), levels(CourseLevel)
  [동작] 다시 만든 것: 탭(kind)·검색·세부 취미·수준·정렬 = GET 폼(쿼리), 이전/다음 쪽 링크
         남긴 것: 없음 (작품 이미지는 /files/works/{id} 권한 URL, 실명·아이디는 표시하지 않음)
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>작품 게시판 · 놀이방</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@500;600;700&amp;display=swap">
  <link rel="stylesheet" th:href="@{/css/sc-base.css}">
  <link rel="stylesheet" th:href="@{/css/tw.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-theme.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-v2.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-nbell.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-side.css}">
  <link rel="stylesheet" th:href="@{/css/gnb-icons.css}">
  <link rel="stylesheet" th:href="@{/css/t-bell.css}">
  <link rel="stylesheet" th:href="@{/css/author-badge.css}">
</head>
<body>
<div id="dc-root"><div class="sc-host">
<div id="root"><div class="app"><header th:replace="~{common/layout :: gnb(menu='works')}"></header><div class="lay"><aside aria-label="사이드 메뉴" class="side"><p class="st">작품 게시판</p><nav aria-label="작품 게시판 메뉴" class="side-ctx"><a aria-current="page" class="active" th:href="@{/works}">작품 목록<span class="side-sr"> (현재 페이지)</span></a></nav></aside><main class="main"><div class="ph bn bn-gallery"><div><h2>작품 게시판</h2><p>다른 사람들이 공개한 작품을 둘러보고, 내 작품도 전시해 보세요.</p></div><div class="row"><a class="btn pri" th:href="@{/my/works/new}">작품 등록</a><span class="sid">U-S09</span></div></div>
<form class="tabs" role="tablist" method="get" th:action="@{/works}">
  <input type="hidden" name="keyword" th:value="${cond.keyword}"/>
  <input type="hidden" name="hobbyId" th:value="${cond.hobbyId}"/>
  <input type="hidden" name="level" th:value="${cond.level}"/>
  <input type="hidden" name="sort" th:value="${cond.sort}"/>
  <button type="submit" role="tab" name="kind" value="" th:class="${cond.kind == null} ? 'on' : ''" th:attr="aria-selected=${cond.kind == null}"><span class="sc-interp">전체 작품</span></button>
  <button type="submit" role="tab" name="kind" value="FINAL" th:class="${cond.kind != null and cond.kind.name() == 'FINAL'} ? 'on' : ''" th:attr="aria-selected=${cond.kind != null and cond.kind.name() == 'FINAL'}"><span class="sc-interp">최종 과제</span></button>
  <button type="submit" role="tab" name="kind" value="GENERAL" th:class="${cond.kind != null and cond.kind.name() == 'GENERAL'} ? 'on' : ''" th:attr="aria-selected=${cond.kind != null and cond.kind.name() == 'GENERAL'}"><span class="sc-interp">일반 작품</span></button>
</form>
<form class="row fpanel" role="search" method="get" th:action="@{/works}" style="align-items: flex-end;">
  <input type="hidden" name="kind" th:value="${cond.kind}"/>
  <div class="field"><label class="lb" for="b-q">검색</label><input id="b-q" name="keyword" placeholder="제목 또는 닉네임" style="width: 240px;" th:value="${cond.keyword}" value=""/></div>
  <div class="field"><label class="lb" for="b-h">세부 취미</label><select id="b-h" name="hobbyId"><option value="">전체</option><option th:each="h : ${hobbies}" th:value="${h.id}" th:selected="${cond.hobbyId != null and cond.hobbyId == h.id}" th:text="${h.name}">색연필화</option></select></div>
  <div class="field"><label class="lb" for="b-l">수준</label><select id="b-l" name="level"><option value="">전체</option><option th:each="lv : ${levels}" th:value="${lv.name()}" th:selected="${cond.level == lv}" th:text="${lv.label}">입문</option></select></div>
  <div class="field"><label class="lb" for="b-s">정렬</label><select id="b-s" name="sort"><option value="latest" th:selected="${!cond.sortByLikes}">최신 공개순</option><option value="likes" th:selected="${cond.sortByLikes}">좋아요순</option></select></div>
  <button class="btn" type="submit">검색</button>
</form>
<p class="h3">공개 작품 <span class="sc-interp" th:text="${works.totalCount}">7</span></p>
<div class="g3 gal-grid" th:unless="${#lists.isEmpty(works.items)}"><a class="box click art" th:each="w : ${works.items}" th:href="@{/works/{id}(id=${w.workId})}"><div class="art-frame"><div class="art-pic" role="img" th:attr="aria-label=${w.title}" th:style="${w.thumbnailFileId != null} ? 'background-image:url(' + @{/files/works/{fid}(fid=${w.thumbnailFileId})} + ');background-size:cover;background-position:center' : null"></div></div><div class="art-body"><p class="h4"><span class="sc-interp" th:text="${w.title}">레몬 마들렌</span></p><p class="mu"><span class="sc-interp" th:text="${w.hobbyName}">디저트 만들기</span> · <span class="sc-interp" th:text="${w.level.label}">입문</span> · <span class="sc-interp" th:text="${w.kind.name() == 'FINAL'} ? '최종 과제' : '일반 작품'">최종 과제</span></p><p class="mu"><span class="an" th:classappend="${w.authorStyle.frameClass}"><span class="sc-interp" th:classappend="${w.authorStyle.nameColorClass}" th:text="${w.authorNickname}">차분한수달 128</span></span><span class="ab-list" th:if="${!#lists.isEmpty(w.authorStyle.badges)}"><span class="ab" th:each="b : ${w.authorStyle.badges}" th:title="${b.title}" th:text="${b.emoji}">🌱</span></span></p><div class="art-stat"><span>♡ 좋아요 <span class="sc-interp" th:text="${w.likeCount}">3</span></span><span>댓글 <span class="sc-interp" th:text="${w.commentCount}">2</span></span></div></div></a></div>
<p class="mu" th:if="${#lists.isEmpty(works.items)}">조건에 맞는 공개 작품이 없어요.</p>
<div class="row" th:if="${works.hasPrevious or works.hasNext}" style="justify-content: center; gap: 12px;">
  <a class="btn sm" th:if="${works.hasPrevious}" th:href="@{/works(page=${works.page - 1}, kind=${cond.kind}, keyword=${cond.keyword}, hobbyId=${cond.hobbyId}, level=${cond.level}, sort=${cond.sort})}">← 이전</a>
  <span class="mu"><span th:text="${works.page + 1}">1</span> 쪽</span>
  <a class="btn sm" th:if="${works.hasNext}" th:href="@{/works(page=${works.page + 1}, kind=${cond.kind}, keyword=${cond.keyword}, hobbyId=${cond.hobbyId}, level=${cond.level}, sort=${cond.sort})}">다음 →</a>
</div>
<p class="mu">공개로 설정한 작품만 게시판에 보여요.</p></main></div><div th:replace="~{common/layout :: footer}"></div></div></div>
</div></div>
</body>
</html>
