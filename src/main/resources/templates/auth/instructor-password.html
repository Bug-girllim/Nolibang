<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  [화면] C-09 강사 첫 로그인 비밀번호 변경   (원본: 0_common/C-09.dc.html)
  [연결] InstructorSetupController · AU-13   → return "auth/instructor-password";
  [상태] 2단계 연결 완료 (#05, 팀원 1)
  [모델] instructor(InstructorDTO — 아이디·이메일), passwordChangeDTO(PasswordChangeDTO — 폼·필드 오류)
  [동작] 다시 만든 것: 비밀번호 변경 완료(POST /auth/instructor/password → 성공 시 /instructor, 오류 시 같은 화면 재표시)
         남긴 것: 입력 중 실시간 규칙 검사(시안 input onChange) — 서버 검증(@Valid)으로 대신함
         지운 것: 진행 단계 "약관 확인"(C-08 미구현, 11-06 결정), "이전 단계" 버튼(돌아갈 C-08이 없음)
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>강사 첫 로그인 비밀번호 변경 · 놀이방</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@500;600;700&amp;display=swap">
  <link rel="stylesheet" th:href="@{/css/sc-base.css}">
  <link rel="stylesheet" th:href="@{/css/tw.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-theme-auth.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-v2.css}">
  <link rel="stylesheet" th:href="@{/css/terms-ui.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-nbell.css}">
  <link rel="stylesheet" th:href="@{/css/gnb-icons.css}">
  <link rel="stylesheet" th:href="@{/css/t-bell.css}">
</head>
<body>
<div id="dc-root"><div class="sc-host">
<div id="root"><div class="app"><header th:replace="~{common/layout :: gnb(menu='')}"></header><div class="ctr"><ol aria-label="진행 단계" class="tp-steps"><li class="done"><span class="n">1</span>임시 비밀번호 로그인</li><li aria-current="step" class="on"><span class="n">2</span>비밀번호 변경</li><li class=""><span class="n">3</span>강사 홈</li></ol><div class="tp-hero"><h1>새 비밀번호로 변경해 주세요</h1><p>관리자가 알려 준 임시 비밀번호는 첫 로그인에만 쓸 수 있어요. 변경하기 전에는 다른 화면을 이용할 수 없어요.</p></div><form class="box tp-card pw-wrap" method="post" th:action="@{/auth/instructor/password}" th:object="${passwordChangeDTO}"><dl class="acct"><dt>아이디</dt><dd th:text="${instructor.loginId}">teacherD</dd><dt>이메일</dt><dd th:text="${instructor.email}">d@example.com</dd></dl><div class="field"><label class="lb" for="pw1">새 비밀번호 *</label><input aria-describedby="pw-rule" aria-invalid="false" autocomplete="new-password" id="pw1" type="password" required th:field="*{newPassword}" th:attr="aria-invalid=${#fields.hasErrors('newPassword')}"/><p class="pw-rule" id="pw-rule">8~16자 · 영문/숫자/특수문자 포함 · 공백 없이 · 아이디·임시 비밀번호와 다르게</p><p class="err" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}">비밀번호 오류</p></div><div class="field"><label class="lb" for="pw2">비밀번호 확인 *</label><input aria-invalid="false" autocomplete="new-password" id="pw2" type="password" required th:field="*{newPasswordConfirm}" th:attr="aria-invalid=${#fields.hasErrors('newPasswordConfirm')}"/><p class="err" th:if="${#fields.hasErrors('newPasswordConfirm')}" th:errors="*{newPasswordConfirm}">확인 오류</p></div><div class="tp-actions"><button class="btn dk next" type="submit">비밀번호 변경 완료</button></div></form></div><div th:replace="~{common/layout :: footer}"></div></div></div>
</div></div>
</body>
</html>
