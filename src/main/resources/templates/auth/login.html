<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  [화면] C-02 로그인   (원본: 0_common/C-02.dc.html)
  [연결] AuthController · AU-01   → return "auth/login";
  [상태] 2단계 연결 완료 (#02 폼·#04 실패 원인별 안내, 팀원 1)
  [모델] errorMessage(로그인 실패·세션 만료), message(로그아웃), unverified(true면 "인증 메일 재발송" 링크 표시)
  [동작] 폼 POST /auth/login(Spring Security), 성공 이동은 AuthSuccessHandler, 실패 이동은 AuthFailHandler가 정한다
  [시안에서 동작하던 요소] 변환 후 동작하지 않음 → 필요한 것만 서버 요청(form·redirect) 또는 짧은 JS로 다시 구현
    - form [onSubmit] "아이디로 로그인 학습자 · 전문 강사 · 관리자 계정 아이디 비밀번호 로"
    - input [onChange] "아이디를 입력하세요"
    - input [onChange] "비밀번호"
    - a [onClick] "로그인"
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>로그인 · 놀이방</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@500;600;700&amp;display=swap">
  <link rel="stylesheet" th:href="@{/css/sc-base.css}">
  <link rel="stylesheet" th:href="@{/css/tw.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-theme-auth.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-v2.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-nbell.css}">
  <link rel="stylesheet" th:href="@{/css/gnb-icons.css}">
  <link rel="stylesheet" th:href="@{/css/t-bell.css}">
</head>
<body>
<div id="dc-root"><div class="sc-host">
<div id="root"><div class="app"><header th:replace="~{common/layout :: gnb(menu='')}"></header><div class="ctr"><div class="ph"><div><h2>로그인</h2><p>아이디·비밀번호 로그인</p></div><div class="row"><span class="sid">C-02</span></div></div><form class="box" method="post" th:action="@{/auth/login}" style="width: 420px; align-self: center; padding: 18px 22px;"><p class="h3">아이디로 로그인</p><p class="mu">학습자 · 전문 강사 · 관리자 계정</p><p class="note" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></p><p class="mu" th:if="${unverified}"><a class="lk" th:href="@{/auth/verify}">인증 메일 재발송</a></p><p class="note" th:if="${message}" th:text="${message}"></p><div class="field"><label class="lb" for="lg-id">아이디</label><input aria-describedby="lg-id-err" aria-invalid="false" autocomplete="username" class="" id="lg-id" name="loginId" required placeholder="아이디를 입력하세요" value=""/></div><div class="field"><label class="lb" for="lg-pw">비밀번호</label><input aria-describedby="lg-pw-err" aria-invalid="false" autocomplete="current-password" class="" id="lg-pw" name="password" required placeholder="비밀번호" type="password" value=""/></div><button class="btn dk w" type="submit" style="text-align: center; justify-content: center;">로그인</button><div class="row" style="justify-content: center;"><a class="lk" th:href="@{/auth/recovery}">아이디 찾기</a><span class="mu">|</span><a class="lk" th:href="@{/auth/recovery}">비밀번호 재설정</a><span class="mu">|</span><a class="lk" th:href="@{/signup}">회원가입</a></div><div class="note">※ 이메일 미인증 계정은 로그인할 수 없습니다.</div></form><div class="note" style="width: 420px; align-self: center; box-sizing: border-box;"><b>시연용 계정</b> (비밀번호 모두 1234 · 출시 화면 제외): <b>learner</b> 학습자 · <b>teacherA</b>/<b>teacherB</b> 강사 · <b>admin</b> 관리자 · <b>newbie</b> 이메일 미인증 · <b>teacherC</b> 비활성 강사 · <b>teacherD</b> 첫 로그인(임시 비밀번호) 강사</div><a aria-hidden="true" style="display: none;" tabindex="-1" th:href="@{/}">이동</a></div><div th:replace="~{common/layout :: footer}"></div></div></div>
</div></div>
</body>
</html>
