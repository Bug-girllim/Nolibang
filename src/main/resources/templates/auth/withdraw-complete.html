<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  [화면] 회원 탈퇴 완료 안내 (시안 없음 — C-04 이메일 인증 결과 화면과 같은 틀로 만들었다)
  [연결] AuthController.withdrawn (GET /auth/withdrawn) ← AccountController.withdraw 성공 후 redirect
  [상태] 탈퇴 직후 세션이 끝나 비로그인 헤더로 보인다
  [모델] rejoinDays(같은 이메일 재가입 제한 일수 — User.REJOIN_RESTRICTION_DAYS)
  [문구] U-S17 탈퇴 탭 안내와 같은 내용을 "끝난 일" 기준으로 다시 알려 준다 (개인정보 처리방침 3항, 05-policy §9)
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원 탈퇴 완료 · 놀이방</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@500;600;700&amp;display=swap">
  <link rel="stylesheet" th:href="@{/css/sc-base.css}">
  <link rel="stylesheet" th:href="@{/css/tw.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-theme-auth.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-v2.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-nbell.css}">
  <link rel="stylesheet" th:href="@{/css/gnb-icons.css}">
  <link rel="stylesheet" th:href="@{/css/t-bell.css}">
</head>
<body>
<div id="dc-root"><div class="sc-host">
<div id="root"><div class="app"><header th:replace="~{common/layout :: gnb(menu='')}"></header><div class="ctr"><div class="ph"><div><h2>회원 탈퇴</h2><p>탈퇴 처리 결과</p></div></div><div class="box" style="width: 520px; max-width: 100%; align-self: center; padding: 18px 22px;"><div class="box dash" role="status" style="align-items: center; padding: 24px; text-align: center;"><img alt="" class="mascot-empty" th:src="@{/images/1d9b928fd58bc3c7e5e6081a421dac3a.png}"/><p class="h4">회원 탈퇴가 완료되었습니다</p><p class="mu">그동안 놀이방을 이용해 주셔서 감사합니다.</p><ul class="mu" style="text-align: left; margin: 4px 0 0; padding-left: 18px; line-height: 1.8;"><li>이 계정으로는 더 이상 로그인할 수 없어요.</li><li>수강·학습 기록, 작품·이미지, 1:1 문의는 삭제되었어요.</li><li>다른 사람 작품에 남긴 댓글은 개인정보를 가린 뒤 '탈퇴한 사용자'로 남아요.</li><li th:text="|같은 이메일로는 탈퇴일로부터 ${rejoinDays}일이 지나야 다시 가입할 수 있어요.|">같은 이메일로는 탈퇴일로부터 30일이 지나야 다시 가입할 수 있어요.</li></ul><div class="row" style="justify-content: center;"><a class="btn dk" th:href="@{/}">홈으로</a><a class="btn" th:href="@{/hobbies}">취미 둘러보기</a></div></div></div></div><div th:replace="~{common/layout :: footer}"></div></div></div>
</div></div>
</body>
</html>
