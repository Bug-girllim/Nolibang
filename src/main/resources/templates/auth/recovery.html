<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  [화면] C-05 아이디 찾기·비밀번호 재설정   (원본: 0_common/C-05.dc.html)
  [연결] AccountRecoveryController · AU-07   → return "auth/recovery";
         GET /auth/recovery?tab=id|password (1·2단계), GET /auth/recovery/login-id?token= (3단계 아이디),
         GET /auth/recovery/password?token= (3단계 새 비밀번호 폼), POST /auth/recovery/send, POST /auth/recovery/password
  [상태] 2단계 연결 완료 (#06, 팀원 1)
  [모델] tab(id|password), step(1~3), sent·maskedEmail(flash, 메일 발송 후), errorMessage,
         loginId(3단계 아이디 찾기 결과), passwordResetDTO(3단계 새 비밀번호 폼)
  [동작] 다시 만든 것: 탭(?tab= — form 속성으로 GET 제출, JS 없음), 인증 이메일 발송(POST), 새 비밀번호 저장(POST)
         남긴 것: 없음. 시안의 "강사 최초 비밀번호 설정 링크 재발송" 안내 문구는 이번 범위(#05 임시 비밀번호 방식)에 없어 지웠다.
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>계정 복구 · 놀이방</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@500;600;700&amp;display=swap">
  <link rel="stylesheet" th:href="@{/css/sc-base.css}">
  <link rel="stylesheet" th:href="@{/css/tw.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-theme-auth.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-v2.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-nbell.css}">
  <link rel="stylesheet" th:href="@{/css/gnb-icons.css}">
  <link rel="stylesheet" th:href="@{/css/t-bell.css}">
</head>
<body>
<div id="dc-root"><div class="sc-host">
<div id="root"><div class="app"><header th:replace="~{common/layout :: gnb(menu='')}"></header><div class="ctr"><div class="ph"><div><h2>계정 복구</h2><p>아이디 찾기 / 비밀번호 재설정</p></div><div class="row"><span class="sid">C-05</span></div></div><div class="box" style="width: 540px; align-self: center; padding: 18px 22px;"><p class="h3">계정 찾기 / 재설정</p><p class="mu">본인 이메일 인증을 거쳐 결과를 제공합니다.</p><form hidden id="rc-tab" method="get" th:action="@{/auth/recovery}"></form><div class="tabs" role="tablist"><button form="rc-tab" name="tab" value="id" role="tab" type="submit" th:classappend="${tab == 'id'} ? 'on'" th:attr="aria-selected=${tab == 'id'}">아이디 찾기</button><button form="rc-tab" name="tab" value="password" role="tab" type="submit" th:classappend="${tab == 'password'} ? 'on'" th:attr="aria-selected=${tab == 'password'}">비밀번호 재설정</button></div><p class="mu">① 이메일 입력 → ② 메일 링크 인증 → ③ 결과 확인 <b>· 현재 <span class="sc-interp" th:text="${step}">1</span>단계</b></p><p class="note" role="alert" th:if="${errorMessage}" th:text="${errorMessage}"></p><p class="note" role="status" th:if="${sent == true}"><span th:text="|${maskedEmail} 주소로 가입된 계정이 있으면 메일을 보냈어요.|">ab***@example.com 주소로 가입된 계정이 있으면 메일을 보냈어요.</span> 메일의 링크를 눌러 다음 단계로 진행해 주세요. 메일이 보이지 않으면 스팸함을 확인하거나 다시 보내 주세요.</p>
<!-- 1·2단계: 가입한 이메일로 인증 메일 받기 -->
<form method="post" th:action="@{/auth/recovery/send}" th:if="${step < 3}" style="display: contents;"><input name="tab" type="hidden" th:value="${tab}"/><div class="field"><label class="lb" for="rc-em">가입한 이메일</label><input aria-invalid="false" class="" id="rc-em" maxlength="254" name="email" placeholder="이메일 주소" required type="email" value=""/></div><button aria-busy="false" class="btn dk" type="submit"><span class="sc-interp" th:text="${sent == true} ? '인증 이메일 다시 발송' : '인증 이메일 발송'">인증 이메일 발송</span></button></form>
<!-- 3단계(아이디 찾기): 결과 -->
<th:block th:if="${loginId != null}"><div class="box dash" role="status" style="align-items: center; text-align: center; padding: 14px;"><p class="mu" style="margin: 0px;">가입한 아이디</p><p class="h4" th:text="${loginId}">learner</p></div><div class="row"><a class="btn dk" th:href="@{/auth/login}">로그인하기</a><a class="btn" th:href="@{/auth/recovery(tab='password')}">비밀번호 재설정</a></div></th:block>
<!-- 3단계(비밀번호 재설정): 새 비밀번호 설정 -->
<form method="post" th:action="@{/auth/recovery/password}" th:if="${passwordResetDTO != null}" th:object="${passwordResetDTO}" style="display: contents;"><input type="hidden" th:field="*{token}"/><div class="field"><label class="lb" for="rc-pw">새 비밀번호</label><input aria-describedby="rc-pw-err" autocomplete="new-password" id="rc-pw" placeholder="8~16자, 영문·숫자·특수문자 포함" required type="password" th:field="*{newPassword}" th:classappend="${#fields.hasErrors('newPassword')} ? 'e'" th:attr="aria-invalid=${#fields.hasErrors('newPassword')}"/><p class="err" id="rc-pw-err" th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}" style="margin: 4px 0px 0px;"></p></div><div class="field"><label class="lb" for="rc-pw2">새 비밀번호 확인</label><input aria-describedby="rc-pw2-err" autocomplete="new-password" id="rc-pw2" placeholder="새 비밀번호를 한 번 더" required type="password" th:field="*{newPasswordConfirm}" th:classappend="${#fields.hasErrors('newPasswordConfirm')} ? 'e'" th:attr="aria-invalid=${#fields.hasErrors('newPasswordConfirm')}"/><p class="err" id="rc-pw2-err" th:if="${#fields.hasErrors('newPasswordConfirm')}" th:errors="*{newPasswordConfirm}" style="margin: 4px 0px 0px;"></p></div><p class="err" th:if="${#fields.hasErrors('token')}" th:errors="*{token}"></p><button aria-busy="false" class="btn dk" type="submit"><span class="sc-interp">새 비밀번호 저장</span></button></form>
</div></div><div th:replace="~{common/layout :: footer}"></div></div></div>
</div></div>
</body>
</html>
