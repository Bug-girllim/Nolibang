<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  [역할] 취미 탐색 화면(U-S01·U-S01-A·U-S02·U-S03·U-S04)이 공통으로 쓰는 왼쪽 사이드 메뉴 조각 (#08)
  [사용법] <aside th:replace="~{hobby/side :: explore(active=${sideActive}, categoryId=${sideCategoryId}, hobbyId=${sideHobbyId})}"></aside>
    active     : all(전체 취미) · category(대분류) · hobby(세부 취미 상세) · courses(수준별 강의 목록) · course(강의 상세)
                 · mine(내 담당 취미 — 강사에게만 보이는 메뉴, T-S08 InstructorHobbyController)
    categoryId : 지금 보는 대분류 id (없으면 null)    hobbyId : 지금 보는 세부 취미 id (없으면 null)
  [모델]   menuCategories(List<CategoryDTO>) — HobbyController·CourseController의 @ModelAttribute가 모든 요청에 넣는다.
           보는 사람에게 보이는 대분류·세부 취미만 들어 있다(비공개는 관리자만).
  [동작]   수준별 강의 목록은 시안처럼 항상 보인다. 세부 취미를 고르지 않았으면 전체 취미의 강의 목록(/courses)으로 간다.
           수준별 강의 목록 화면에서 세부 취미를 누르면 상세가 아니라 같은 수준의 그 취미 강의 목록으로 이동한다.
  [참고]   시안에서 화면마다 복사돼 있던 같은 메뉴를 한 조각으로 합쳤다. 태그·class는 시안 그대로다.
-->
<body>
<aside aria-label="사이드 메뉴" class="side" th:fragment="explore(active, categoryId, hobbyId)"><p class="st">취미 탐색</p><nav aria-label="취미 탐색 메뉴" class="side-ctx"><a class="" th:if="${loginUser != null and loginUser.role.name() == 'INSTRUCTOR'}" th:classappend="${active == 'mine'} ? 'active'" th:aria-current="${active == 'mine'} ? 'page' : null" th:href="@{/instructor/hobbies}">내 담당 취미<span class="side-sr" th:if="${active == 'mine'}"> (현재 페이지)</span></a><div class="side-hv"><a class="" th:classappend="${active == 'all'} ? 'active'" th:aria-current="${active == 'all'} ? 'page' : null" th:href="@{/hobbies}">전체 취미<span class="side-sr" th:if="${active == 'all'}"> (현재 페이지)</span></a><div aria-label="큰 분야" class="side-fly" role="group"><a class="" th:each="category : ${menuCategories}" th:classappend="${category.id == categoryId} ? 'active'" th:aria-current="${category.id == categoryId} ? 'page' : null" th:href="@{/hobbies(categoryId=${category.id})}" th:text="${category.name}">미술·드로잉</a></div></div><div class="side-hv"><a class="" th:classappend="${active == 'hobby'} ? 'active'" th:href="@{/hobbies}">세부 취미 상세</a><div aria-label="세부 취미" class="side-fly" role="group"><th:block th:each="category : ${menuCategories}"><a class="" th:each="hobby : ${category.hobbies}" th:classappend="${hobby.id == hobbyId} ? 'active'" th:aria-current="${hobby.id == hobbyId} ? 'page' : null" th:href="${active == 'courses'} ? (${selectedLevel != null} ? @{/courses(hobbyId=${hobby.id}, level=${selectedLevel})} : @{/courses(hobbyId=${hobby.id})}) : @{/hobbies/{id}(id=${hobby.id})}" th:text="${hobby.name}">색연필화</a></th:block></div></div><a class="" th:classappend="${active == 'courses'} ? 'active'" th:aria-current="${active == 'courses'} ? 'page' : null" th:href="${hobbyId != null} ? @{/courses(hobbyId=${hobbyId})} : @{/courses}">수준별 강의 목록<span class="side-sr" th:if="${active == 'courses'}"> (현재 위치)</span></a></nav></aside>
</body>
</html>
