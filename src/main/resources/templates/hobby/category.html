<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  [화면] U-S01-A 대분류 취미 탐색   (원본: 1_learner/U-S01-art.dc.html)
  [연결] HobbyController · HB-01 (대분류별 보기 — 4개 변형의 대표)   → return "hobby/category";
  [상태] 2단계 연결 완료 (#08, 팀원 2)
  [통합] 같은 디자인의 변형 화면: U-S01-baking, U-S01-craft, U-S01-photo — 대분류에 따라 배너 스타일(bn-*)만 바뀐다
  [모델] category(CategoryDTO + hobbies). 사이드 메뉴 모델: menuCategories·sideActive·sideCategoryId
  [동작] 다시 만든 것: 세부 취미 카드 → /hobbies/{id}
         남긴 것(이번 범위 밖): 취미 이름 검색 — API 명세·이슈에 없는 기능이라 폼을 지웠다
  [정리] 시안의 "강의 3"·"수강 중/미수강" 칩은 이 화면의 모델에 없어 뺐다(내 수강 상태는 강의 화면에서 본다). 대분류 설명 문장도 DB에 없어 뺐다.
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title th:text="|${category.name} 취미 탐색 · 놀이방|">미술·드로잉 취미 탐색 · 놀이방</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@500;600;700&amp;display=swap">
  <link rel="stylesheet" th:href="@{/css/sc-base.css}">
  <link rel="stylesheet" th:href="@{/css/tw.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-theme.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-v2.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-nbell.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-side.css}">
  <link rel="stylesheet" th:href="@{/css/gnb-icons.css}">
  <link rel="stylesheet" th:href="@{/css/t-bell.css}">
  <link rel="stylesheet" th:href="@{/css/side-fly.css}">
  <link rel="stylesheet" th:href="@{/css/prep-badge.css}">
</head>
<body>
<div id="dc-root"><div class="sc-host">
<div id="root"><div class="app"><header th:replace="~{common/layout :: gnb(menu='hobby')}"></header><div class="lay"><aside th:replace="~{hobby/side :: explore(active=${sideActive}, categoryId=${sideCategoryId}, hobbyId=${sideHobbyId})}"></aside><main class="main"><div class="ph bn" th:classappend="${category.bannerClass}"><div><h2 th:text="|${category.name} 취미 탐색|">미술·드로잉 취미 탐색</h2><p><a class="lk" th:href="@{/hobbies}">전체 취미 보기</a></p></div><div class="row"><span class="sid">U-S01-A</span></div></div><div class="col"><div class="row cat-hd"><p class="h3" th:text="${category.name}">미술·드로잉</p><span class="chip" th:classappend="${category.state.name() == 'PREPARING'} ? 'prep-pill'" th:text="${category.stateLabel}">운영 중</span></div><div class="g3 hb-grid"><a class="box click hb" th:each="hobby : ${category.hobbies}" th:href="@{/hobbies/{id}(id=${hobby.id})}"><div class="hb-pic" th:classappend="${hobby.picClass}" role="img" th:attr="aria-label=|${hobby.name} 대표 이미지|"><span class="hb-flag" th:if="${hobby.state.name() == 'PREPARING'}">준비 중</span></div><div class="hb-body"><p class="h4" th:text="${hobby.name}">색연필화</p><p class="mu" th:if="${!#strings.isEmpty(hobby.description)}" th:text="${hobby.description}">색연필로 정물과 풍경을 그리는 취미</p><div class="hb-meta"><span class="chip run" th:unless="${hobby.state.name() == 'PREPARING'}" th:text="${hobby.stateLabel}">운영 중</span></div></div></a></div><p class="box dash" role="status" th:if="${#lists.isEmpty(category.hobbies)}">이 분야에는 아직 볼 수 있는 세부 취미가 없어요.</p></div></main></div><div th:replace="~{common/layout :: footer}"></div></div></div>
</div></div>
</body>
</html>
