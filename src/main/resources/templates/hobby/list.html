<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<!--
  [화면] U-S01 전체 취미   (원본: 1_learner/U-S01.dc.html)
  [연결] HobbyController · HB-01   → return "hobby/list";
  [상태] 2단계 연결 완료 (#08, 팀원 2)
  [모델] categories(List<CategoryDTO>) — 보는 사람에게 보이는 대분류만(비공개는 관리자만). 사이드 메뉴 모델: menuCategories·sideActive
  [동작] 다시 만든 것: 대분류 카드 → /hobbies?categoryId= (대분류별 보기)
  [정리] categories 표에 소개 문구 칼럼이 없어 시안의 대분류 설명 문장을 뺐다. 사이드 메뉴는 hobby/side.html 조각으로 합쳤다.
-->
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>전체 취미 · 놀이방</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&amp;family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Noto+Sans+KR:wght@400;500;700&amp;family=Noto+Serif+KR:wght@500;600;700&amp;display=swap">
  <link rel="stylesheet" th:href="@{/css/sc-base.css}">
  <link rel="stylesheet" th:href="@{/css/tw.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-theme.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-v2.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-nbell.css}">
  <link rel="stylesheet" th:href="@{/css/atelier-side.css}">
  <link rel="stylesheet" th:href="@{/css/gnb-icons.css}">
  <link rel="stylesheet" th:href="@{/css/t-bell.css}">
  <link rel="stylesheet" th:href="@{/css/bigcat.css}">
  <link rel="stylesheet" th:href="@{/css/side-fly.css}">
</head>
<body>
<div id="dc-root"><div class="sc-host">
<div id="root"><div class="app"><header th:replace="~{common/layout :: gnb(menu='hobby')}"></header><div class="lay"><aside th:replace="~{hobby/side :: explore(active=${sideActive}, categoryId=${sideCategoryId}, hobbyId=${sideHobbyId})}"></aside><main class="main"><div class="ph bn bn-explore"><div><h2>전체 취미</h2><p>관심 있는 분야를 골라 보세요. 분야를 누르면 그 안의 세부 취미를 볼 수 있어요.</p></div><div class="row"><span class="sid">U-S01</span></div></div><div class="cat-grid"><a class="box click bigcat" th:each="category : ${categories}" th:attr="aria-label=|${category.name} — 세부 취미 보기|" th:href="@{/hobbies(categoryId=${category.id})}"><div class="bigcat-pic" th:if="${category.imagePath != null}"><img alt="" th:src="@{${category.imagePath}}"/></div><div class="bigcat-body"><div class="rowb"><p class="h3"><span class="sc-interp" th:text="${category.name}">미술·드로잉</span></p><span class="chip"><span class="sc-interp" th:text="${category.stateLabel}">운영 중</span></span></div><p class="bigcat-sub"><span class="sc-interp" th:text="|세부 취미 ${category.hobbyCount}개 · 운영 중 ${category.operatingCount}개|">세부 취미 2개 · 운영 중 2개</span></p></div></a></div><p class="box dash" role="status" th:if="${#lists.isEmpty(categories)}">지금 볼 수 있는 취미가 없어요.</p></main></div><div th:replace="~{common/layout :: footer}"></div></div></div>
</div></div>
</body>
</html>
