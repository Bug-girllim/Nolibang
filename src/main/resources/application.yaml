spring:
  application:
    name: lms-practice

  # ── DB 연결 ──
  #   DB 이름 nolibang, 문자셋 utf8mb4, 시간대 UTC (데이터베이스/DB_설계서.md §0-3)
  #   - 한글 50자 검사가 정확하려면 utf8mb4 필수
  #   - 30일·7일 기한은 UTC로 저장·계산하고 화면에서 KST로 바꿔 보여 준다
  #   접속 정보는 환경변수로 덮어쓴다. 설정하지 않으면 로컬 MySQL(wanted/wanted)을 쓴다.
  #   클라우드 DB(공용)는 DB_URL / DB_USERNAME / DB_PASSWORD 를 환경변수로 넣는다. 비밀번호를 이 파일에 적지 않는다.
  #   예) DB_URL=jdbc:mysql://<호스트>:<포트>/nolibang?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&sslMode=REQUIRED
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/nolibang?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:wanted}
    password: ${DB_PASSWORD:wanted}

  # ── JPA ──
  jpa:
    hibernate:
      ddl-auto: none        # 테이블은 sql/schema.sql 로 직접 생성
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # ── 파일 업로드 (작품 이미지) ──
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 300MB  # 💡 이미지 최대 5장 × 50MB = 250MB + 여유 (docs/CONVENTIONS.md §10 #7, #16에서 업로드 테스트 후 조정)

  thymeleaf:
    cache: false

server:
  servlet:
    session:
      timeout: 60m

# 업로드 파일 저장 경로 (global/file 에서 사용, #16)
file:
  upload-dir: ./uploads

# ── 이메일 인증 메일 (#04, #06) ──
#   SMTP를 쓰려면 위 spring: 아래에 mail 설정(host·port·username·password 등)을 넣는다.
#   spring.mail.host 가 없으면 메일은 보내지 않고, 인증 링크를 서버 로그(WARN)에 남긴다 — 개발·시연 확인용 ❓ #01 확정 필요
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}      #메일 링크의 주소. 배포하면 실제 주소로 바꾼다
  mail:
    from: no-reply@nolibang.local      # 발신 주소 (SMTP 계정이 있으면 그 주소로)
  token:
    verify-email-hours: 24             # ❓ 인증 토큰 만료 시간 임시값 (API §16-1, #01 확정 필요)
