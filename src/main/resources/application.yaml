spring:
  application:
    name: lms-practice

  # ==================================================
  # 1. MySQL DB 연결
  # ==================================================
  # 환경변수 미설정: 로컬 MySQL 사용
  # 환경변수 설정: 공용 MySQL 사용
  #
  # DB_URL
  # DB_USERNAME
  # DB_PASSWORD
  #
  # 공용 DB 비밀번호는 GitHub에 올리지 않는다.

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/nolibang?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:wanted}
    password: ${DB_PASSWORD:wanted}

  # ==================================================
  # 2. JPA 설정
  # ==================================================
  jpa:
    hibernate:
      ddl-auto: none

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # ==================================================
  # 3. 파일 업로드 용량 설정
  # ==================================================
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 300MB

  # ==================================================
  # 4. Thymeleaf 설정
  # ==================================================
  thymeleaf:
    cache: false

  # ==================================================
  # 5. Gmail SMTP 이메일 인증
  # ==================================================
  # Gmail 2단계 인증 및 앱 비밀번호 필요
  #
  # MAIL_USERNAME = 발송용 Gmail 주소
  # MAIL_PASSWORD = Gmail 앱 비밀번호
  #
  # 실제 비밀번호를 YAML에 작성하지 않는다.

  mail:
    host: smtp.gmail.com
    port: 587
    # 기본값(빈 값)은 환경변수가 없는 PC에서도 앱이 뜨게 하려는 것. 실제 값은 IntelliJ 실행 환경변수로만 넣는다
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# ==================================================
# 6. 서버 및 세션 설정
# ==================================================
server:
  servlet:
    session:
      timeout: 60m

# ==================================================
# 7. 파일 저장 설정
# ==================================================
# 현재 MVP는 로컬 파일 저장 방식 사용
#
# 작품 및 과제 이미지:
#   ./uploads/works/
#
# 강의 영상:
#   ./uploads/videos/course-N/lesson-M.mp4
#
# 외부 저장소(S3 등)는 사용하지 않는다.

file:
  storage: local
  upload-dir: ./uploads

# ==================================================
# 8. 이메일 인증 및 애플리케이션 설정
# ==================================================
app:
  # 로컬 테스트:
  # http://localhost:8080
  #
  # 배포 시:
  # APP_BASE_URL 환경변수로 실제 접속 주소 지정

  base-url: ${APP_BASE_URL:http://localhost:8080}

  mail:
    # Gmail은 발신 주소가 로그인 계정과 같아야 한다. 환경변수가 없으면 이전 기본값을 쓴다
    from: ${MAIL_USERNAME:no-reply@nolibang.local}

  token:
    # 이메일 인증 링크 유효시간: 24시간
    verify-email-hours: 24
