spring:
  application:
    name: lms-practice

  # ==================================================
  # 1. MySQL DB 연결 — 기본은 항상 로컬 MySQL
  # ==================================================
  # 공용 원격 DB(Aiven)는 왕복이 길어 화면이 느려서, 실행·테스트 기본값은 로컬 DB로 둔다.
  # 환경변수 DB_URL·DB_USERNAME·DB_PASSWORD 가 설정돼 있어도 기본 실행에서는 쓰지 않는다.
  #
  # 공용 DB로 실행하려면 프로필 shared 를 켠다 (application-shared.yaml 이 DB_URL·DB_USERNAME·DB_PASSWORD 를 읽는다)
  #   - IntelliJ: 실행 설정 → Active profiles 에 shared
  #   - 환경변수: SPRING_PROFILES_ACTIVE=shared
  # 배포(prod 프로필)도 DB_URL·DB_USERNAME·DB_PASSWORD 를 읽는다 (application-prod.yaml)
  #
  # 로컬 MySQL 계정이 wanted/wanted 가 아니면 LOCAL_DB_URL·LOCAL_DB_USERNAME·LOCAL_DB_PASSWORD 로 바꿀 수 있다.
  # 공용 DB 비밀번호는 GitHub에 올리지 않는다.

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${LOCAL_DB_URL:jdbc:mysql://localhost:3306/nolibang?characterEncoding=UTF-8&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${LOCAL_DB_USERNAME:wanted}
    password: ${LOCAL_DB_PASSWORD:wanted}

    # ── 1-1. DB 왕복 줄이기 (공용 원격 DB는 왕복 1번에 100ms 이상이라, 쿼리 수보다 "주고받는 횟수"가 속도를 정한다) ──
    # 기본 설정이면 @Transactional 메서드 하나마다 쿼리와 별개로 아래 명령이 DB와 따로따로 오간다:
    #   SET autocommit=0 → set session transaction read only → (쿼리) → COMMIT → SET autocommit=1 → set session transaction read write
    # 아래 설정으로 그 부가 왕복을 없앤다. 로컬 DB에서도 그대로 동작한다(왕복이 짧아 티가 덜 날 뿐).
    hikari:
      # 커넥션을 처음부터 autocommit=false 로 만들어 두어, 트랜잭션마다 autocommit 을 껐다 켜는 왕복을 없앤다
      # (아래 jpa ... provider_disables_autocommit: true 와 짝 — Hibernate 에게 "이미 꺼져 있으니 건드리지 말라"고 알린다)
      auto-commit: false
      # 쉬고 있는 커넥션을 1분마다 미리 확인해 둔다 — LmsPracticeApplication 에서 "꺼낼 때 확인"을 30초에 한 번으로 줄인 대신
      keepalive-time: 60000
      data-source-properties:
        # readOnly 트랜잭션 표시를 DB 서버에 보내지 않는다 (읽기 전용 보장은 JPA/Hibernate 쪽 readOnly 가 그대로 한다)
        readOnlyPropagatesToServer: false
        # 드라이버가 autocommit·격리 수준 같은 세션 상태를 기억해 두고, 이미 같은 값이면 명령을 보내지 않는다
        useLocalSessionState: true
        # 실제로 열린 트랜잭션이 없으면 COMMIT·ROLLBACK 을 보내지 않는다
        useLocalTransactionState: true

  # ==================================================
  # 2. JPA 설정
  # ==================================================
  jpa:
    hibernate:
      ddl-auto: none

    show-sql: true

    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
        connection:
          # 1-1 의 hikari.auto-commit: false 와 짝 — 트랜잭션 시작 때 autocommit 확인·변경 왕복을 건너뛴다
          provider_disables_autocommit: true

  # ==================================================
  # 3. 파일 업로드 용량 설정
  # ==================================================
  servlet:
    multipart:
      # 파일 한 개 500MB: 관리자 영상 업로드(VideoStorage) 기준. 이미지는 FileStorage가 장당 50MB로 따로 검사한다
      max-file-size: 500MB
      # 요청 전체: 영상 1개(500MB) + 폼 값 여유. 이미지 여러 장(장당 50MB·최대 5장)도 이 안에 들어간다
      max-request-size: 510MB

  # ==================================================
  # 4. Thymeleaf 설정
  # ==================================================
  # 배포 시에는 application-prod.yaml(SPRING_PROFILES_ACTIVE=prod)이 템플릿 캐시·응답 압축을 켜고 SQL 콘솔 출력을 끈다
  thymeleaf:
    cache: false

  # ==================================================
  # 4-1. 정적 파일(css·js·images) 캐시
  # Spring Security가 모든 응답에 붙이는 Cache-Control: no-store가 정적 파일까지 덮어써서 브라우저가
  # 페이지를 옮길 때마다 CSS·이미지를 다시 받았다. 기간을 지정하면 Security가 덮어쓰지 않는다.
  # 파일 내용이 바뀌면 주소가 바뀌도록(내용 해시) 버전을 붙여서 오래 캐시해도 낡은 파일이 남지 않는다.
  # ==================================================
  web:
    resources:
      cache:
        cachecontrol:
          max-age: 7d
          cache-public: true
      chain:
        strategy:
          content:
            enabled: true
            paths: /css/**,/js/**,/images/**

  # ==================================================
  # 5. Gmail SMTP 이메일 인증
  # ==================================================
  # Gmail 2단계 인증 및 앱 비밀번호 필요
  #
  # MAIL_USERNAME = 발송용 Gmail 주소
  # MAIL_PASSWORD = Gmail 앱 비밀번호
  #
  # 실제 비밀번호를 YAML에 작성하지 않는다.

  mail:
    host: smtp.gmail.com
    port: 587
    # 기본값(빈 값)은 환경변수가 없는 PC에서도 앱이 뜨게 하려는 것. 실제 값은 IntelliJ 실행 환경변수로만 넣는다
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# ==================================================
# 6. 서버 및 세션 설정
# ==================================================
server:
  servlet:
    session:
      timeout: 60m
      cookie:
        same-site: lax      # 다른 사이트에서 온 POST에는 세션 쿠키를 보내지 않는다 (CSRF 2차 방어)
        # secure: true      # HTTPS로 배포할 때 켠다 (HTTP 개발 환경에서는 로그인이 안 되므로 기본은 끔)

# ==================================================
# 7. 파일 저장 설정
# ==================================================
# 업로드 파일 저장 (global/file 에서 사용, #16)
#   storage=local(기본): upload-dir 폴더에 저장 — 로컬 개발용
#   storage=s3: S3 호환 저장소(Cloudflare R2·AWS S3)에 저장 — 공용 서비스용. 아래 값은 모두 환경변수로 넣는다(키를 파일에 적지 않는다)
#     FILE_STORAGE=s3, S3_ENDPOINT(R2: https://<계정ID>.r2.cloudflarestorage.com / AWS S3는 비움),
#     S3_REGION(R2: auto / AWS: ap-northeast-2 등), S3_BUCKET, S3_ACCESS_KEY, S3_SECRET_KEY
#   강의 영상은 같은 버킷의 videos/course-N/lesson-M.mp4 key 로 올린다(시드의 video_key 와 같은 경로)

file:
  storage: ${FILE_STORAGE:local}
  upload-dir: ./uploads
  s3:
    endpoint: ${S3_ENDPOINT:}
    region: ${S3_REGION:auto}
    bucket: ${S3_BUCKET:}
    access-key: ${S3_ACCESS_KEY:}
    secret-key: ${S3_SECRET_KEY:}

# ==================================================
# 8. 이메일 인증 및 애플리케이션 설정
# ==================================================
app:
  # 로컬 테스트:
  # http://localhost:8080
  #
  # 배포 시:
  # APP_BASE_URL 환경변수로 실제 접속 주소 지정

  base-url: ${APP_BASE_URL:http://localhost:8080}

  mail:
    # Gmail은 발신 주소가 로그인 계정과 같아야 한다. 환경변수가 없으면 이전 기본값을 쓴다
    from: ${MAIL_USERNAME:no-reply@nolibang.local}

  token:
    # 이메일 인증 링크 유효시간: 24시간
    verify-email-hours: 24
